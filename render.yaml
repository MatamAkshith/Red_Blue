services:
  # REDBLUE Backend FastAPI Web Service
  - type: web
    name: redblue-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: REDBLUE_DB_PATH
        value: blackbox.db
      - key: FRONTEND_URL
        sync: false

  # REDBLUE Frontend Static Site
  - type: static
    name: redblue-frontend
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
